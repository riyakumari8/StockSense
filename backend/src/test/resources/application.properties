spring.application.name=backend-test

# H2 in PostgreSQL compatibility mode so the exact same Flyway migrations
# used against real Postgres also run here. @DataJpaTest classes in this
# module use @AutoConfigureTestDatabase(replace = Replace.NONE) so Spring
# doesn't swap this out for its own anonymous embedded database.
spring.datasource.url=jdbc:h2:mem:stocksense_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

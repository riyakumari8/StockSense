spring.application.name=backend

# --- Database ---------------------------------------------------------
# Override any of these with real env vars in your shell / docker-compose:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
spring.datasource.username=${DB_USERNAME:stocksense}
spring.datasource.password=${DB_PASSWORD:stocksense}

# --- JPA / Hibernate ----------------------------------------------------
# Flyway owns the schema; Hibernate must only validate entity <-> table
# mappings, never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway --------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.application.name=stocksense-backend

# --- Database ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
spring.datasource.username=${DB_USERNAME:stocksense}
spring.datasource.password=${DB_PASSWORD:stocksense}
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway (disabled for dev — enable for production) -----------------
spring.flyway.enabled=false

# --- Jackson -----------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- Server ------------------------------------------------------------
server.port=${PORT:8080}
